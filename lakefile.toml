name = "fmfm"
version = "0.1.0"
defaultTargets = ["fmfm", "Firmware", "Spec", "Proofs", "Examples"]

# Core Lean only: no Mathlib, so builds stay fast and there is no cache to fetch.
# If you add a dependency, pin its `rev` here and commit lake-manifest.json.

[[lean_lib]]
name = "Fmfm"

# Code that runs on the FM-1. Compiled to C and linked into the firmware (see tools/build_lean_fw.sh),
# so it may only use what rt/lean_rt.c supports: see docs/LEAN-ON-CHIP.md.
[[lean_lib]]
name = "Firmware"

# Spec: the plain definitions needed to state what is promised. Proofs: the promises, proved.
[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Proofs"

# Examples: every theorem instantiated on concrete inputs, and inputs the specs reject. Imports Proofs, so it
# cannot be part of Spec (Challenge imports Spec and must not see the proofs).
[[lean_lib]]
name = "Examples"

# Challenge: the statements of Proofs/ as axioms, generated by tools/gen_challenge.py, for `lake comparator`.
# Not a default target: `lake check` would rightly reject its axioms.
[[lean_lib]]
name = "Challenge"

[[lean_exe]]
name = "fmfm"
root = "Main"
