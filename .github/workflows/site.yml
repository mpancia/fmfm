name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                      # the pitch deck counts the commits and the hours
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential python3 python3-venv bubblewrap ffmpeg
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            vendor
            build/init
          key: tc-${{ hashFiles('lean-toolchain', 'tools/vendor.sh') }}
      - name: make install
        run: make install
      - name: Build the simulator and the package
        run: make web && make fw && make test
      - name: Assemble the site
        run: .venv/bin/python tools/make_site.py "0.1.${{ github.run_number }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
